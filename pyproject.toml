[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vayucast"
version = "0.1.0"
description = "Automated MLOps pipeline for 1-3 day Delhi air quality (PM2.5 & CPCB AQI) forecasting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    "httpx>=0.27.0",
    "pandas>=2.3.3,<3.0.0",
    "numpy>=2.0.0",
    "lightgbm>=4.5.0",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.0",
    "boto3>=1.35.0",
]

[project.optional-dependencies]
train = [
    "scikit-learn>=1.5.0",
    "pyarrow>=17.0.0",
    "mlflow>=3.0.0",
    "evidently>=0.7.0,<0.8.0",
    "dvc[s3]>=3.55.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
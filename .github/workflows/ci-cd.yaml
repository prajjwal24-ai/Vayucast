name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, Test, Quality Gate & Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[train,dev]"

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Run unit & API tests
        run: pytest -v

      - name: Run data ingestion, quality gate & drift check
        run: |
          python -m vayucast.ingest
          python -m vayucast.train --fail-on-gate
          python -m vayucast.drift

      - name: Upload evaluation & drift artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-evaluation-artifacts
          path: |
            artifacts/metadata.json
            reports/drift_summary.json
            reports/drift_report.html

      - name: Verify Docker image builds cleanly
        run: docker build -t vayucast:ci .
  deploy:
    name: Deploy to EC2
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/vayucast:latest" -t "$ECR_REGISTRY/vayucast:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/vayucast:latest"
          docker push "$ECR_REGISTRY/vayucast:$IMAGE_TAG"

      - name: Deploy container on EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          VAYUCAST_RELOAD_TOKEN: ${{ secrets.VAYUCAST_RELOAD_TOKEN }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key ubuntu@"$EC2_HOST" \
            AWS_REGION="$AWS_REGION" \
            AWS_S3_BUCKET="$AWS_S3_BUCKET" \
            ECR_REGISTRY="$ECR_REGISTRY" \
            RELOAD_TOKEN="$VAYUCAST_RELOAD_TOKEN" \
            'bash -s' <<'REMOTE'
          set -euo pipefail
          export PATH="$PATH:/usr/local/bin"

          aws ecr get-login-password --region "$AWS_REGION" \
            | sudo docker login --username AWS --password-stdin "$ECR_REGISTRY"

          sudo docker pull "$ECR_REGISTRY/vayucast:latest"
          sudo docker rm -f vayucast-api || true
          sudo docker run -d \
            --name vayucast-api \
            --restart unless-stopped \
            -p 127.0.0.1:8000:8000 \
            -e AWS_S3_BUCKET="$AWS_S3_BUCKET" \
            -e AWS_REGION="$AWS_REGION" \
            -e VAYUCAST_RELOAD_TOKEN="$RELOAD_TOKEN" \
            "$ECR_REGISTRY/vayucast:latest"

          sudo docker image prune -f
          REMOTE

      - name: Verify live HTTPS health endpoint
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in 1 2 3 4 5; do
            sleep 4
            if curl -fsS "https://$EC2_HOST/health" | tee /dev/stderr | grep -q '"model_loaded":true'; then
              echo "Deployment healthy!"
              exit 0
            fi
          done
          echo "Health check failed after 5 attempts."
          exit 1

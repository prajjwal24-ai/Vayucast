name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ci:
    name: Lint, Test, Quality Gate & Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[train,dev]"

      - name: Lint with Ruff
        run: ruff check src/ tests/

      - name: Run unit & API tests
        run: pytest -v

      - name: Run data ingestion, quality gate & drift check
        run: |
          python -m vayucast.ingest
          python -m vayucast.train --fail-on-gate
          python -m vayucast.drift

      - name: Upload evaluation & drift artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ci-evaluation-artifacts
          path: |
            artifacts/metadata.json
            reports/drift_summary.json
            reports/drift_report.html

      - name: Verify Docker image builds cleanly
        run: docker build -t vayucast:ci .